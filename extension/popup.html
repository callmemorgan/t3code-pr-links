<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T3Code PR Links</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="mark" aria-hidden="true">T3</span><h1>T3Code PR Links</h1><span id="version"></span></header>
  <div id="connection" data-state="checking"><div id="status" role="status">Checking connections…</div><p id="details"></p></div>
  <a id="connect-link" class="secondary-link" target="_blank" rel="noopener" hidden>Connect to T3 Code →</a>
  <section id="context" hidden aria-label="Threads for this GitHub page">
    <a id="context-title"></a>
    <p id="context-branch" class="hint"><a id="context-branch-link" target="_blank" rel="noopener"></a></p>
    <div id="threads"></div>
    <p id="empty" hidden>No matching T3 threads on the computers checked.</p>
    <a id="browse" class="secondary-link" target="_blank" rel="noopener">Browse repository threads <span aria-hidden="true">→</span></a>
  </section>
  <details id="filters">
    <summary>Filters</summary>
    <label><input id="includeArchived" type="checkbox"> Include archived threads</label>
    <label><input id="includeBranch" type="checkbox"> Include branch matches</label>
    <label><input id="includeSubagents" type="checkbox"> Include sub-agent threads</label>
    <label><input id="listBadges" type="checkbox"> Show badges on PR lists</label>
    <label><input id="liveBranches" type="checkbox"> Check current workspaces for branch matches</label>
    <label for="computer">Computer</label>
    <select id="computer"><option value="all">All configured computers</option></select>
    <label for="sort">Thread order</label>
    <select id="sort"><option value="active">Active first</option><option value="recent">Recent activity</option><option value="title">Thread title</option><option value="branch">Branch</option><option value="computer">Computer</option></select>
    <p id="settings-error" role="status"></p>
  </details>
  <footer><button id="retry" type="button">Refresh</button><a id="lookup-link" target="_blank" rel="noopener">Find threads</a><a id="settings-link" target="_blank" rel="noopener">Settings</a></footer>
  <script src="common.js"></script>
  <script src="ui.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
